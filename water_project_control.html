<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة البنود والمقايسات</title>
    <!-- Tailwind CSS للتصميم السريع والنظيف -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- رأس الصفحة -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="text-xs text-slate-400">م. كريم • مهندس موقع • الإثنين 28 سبتمبر</div>
            <h1 class="text-lg font-bold text-teal-400">محطة الريحانة</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- قسم رفع المقايسة/الصورة -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm">
            <label class="block text-sm font-semibold mb-2 text-slate-300">إرفاق صورة المناقصة / المقايسة</label>
            <input type="file" id="boqImage" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-teal-600 file:text-white hover:file:bg-teal-700 cursor-pointer">
            <button onclick="processBOQ()" class="mt-3 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition shadow-lg">
                تحليل وعرض البنود
            </button>
        </div>

        <!-- ملخص الحالة العامة -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm flex justify-between items-center">
            <div>
                <span id="itemsCount" class="text-xl font-bold text-teal-400">0</span>
                <p class="text-xs text-slate-400">إجمالي البنود المستخرجة</p>
            </div>
            <div class="text-left">
                <span id="grandTotal" class="text-lg font-bold text-amber-400">0</span>
                <p class="text-xs text-slate-400">الإجمالي الكلي (جنيه/عملة)</p>
            </div>
        </div>

        <h2 class="text-md font-bold text-slate-200 mt-6 mb-3">بنود المقايسة الجارية</h2>

        <!-- قائمة البنود الديناميكية (تتعبأ تلقائياً من الـ JSON) -->
        <div id="itemsContainer" class="space-y-3">
            <!-- سيتم حقن البنود هنا برمجياً -->
        </div>

    </main>

    <!-- شريط التنقل السفلي (مماثل للصورة) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 py-3 px-6 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around text-slate-400 text-xs">
            <button class="flex flex-col items-center hover:text-teal-400">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                سجلي
            </button>
            <button class="flex flex-col items-center hover:text-teal-400">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                تحديث بند
            </button>
            <button class="flex flex-col items-center text-teal-400 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                اليوم
            </button>
        </div>
    </nav>

    <!-- سكربت جافاسكريبت لربط الـ JSON وعرضه -->
    <script>
        // بيانات الـ JSON التي استخرجناها
        const boqData = {
          "items": [
            {
              "item_number": "1-1",
              "parent_number": "1",
              "title": "مواسير قطر 250مم حتى عمق 3م",
              "unit": "م.ط",
              "quantity": 240,
              "unit_price": 4200,
              "total": 1008000
            },
            {
              "item_number": "1-2",
              "parent_number": "1",
              "title": "مواسير قطر 200مم حتى عمق 3م",
              "unit": "م.ط",
              "quantity": 75,
              "unit_price": 3600,
              "total": 270000
            },
            {
              "item_number": "1-3",
              "parent_number": "1",
              "title": "مواسير قطر 160مم حتى عمق 1.5م",
              "unit": "م.ط",
              "quantity": 130,
              "unit_price": 1250,
              "total": 162500
            },
            {
              "item_number": "2-1",
              "parent_number": "2",
              "title": "طبق جرل حتى عمق 3م",
              "unit": "عدد",
              "quantity": 16,
              "unit_price": 8200,
              "total": 131200
            }
          ],
          "grand_total": 2752500,
          "warnings": []
        };

        function processBOQ() {
            const fileInput = document.getElementById('boqImage');
            if(fileInput.files.length === 0) {
                alert('الرجاء إرفاق صورة المقايسة أولاً');
                return;
            }

            // عرض البيانات في الواجهة بناءً على الـ JSON
            document.getElementById('itemsCount').innerText = boqData.items.length;
            document.getElementById('grandTotal').innerText = boqData.grand_total.toLocaleString();

            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            boqData.items.forEach(item => {
                const card = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm hover:border-teal-500 transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-slate-700 text-teal-400 px-2 py-1 rounded-lg font-mono">بند: ${item.item_number}</span>
                            <span class="text-xs bg-amber-900/40 text-amber-300 px-2 py-1 rounded-lg">${item.unit}</span>
                        </div>
                        <h3 class="font-bold text-slate-100 text-sm mb-3">${item.title}</h3>
                        <div class="grid grid-cols-3 gap-2 text-xs bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center">
                            <div>
                                <span class="text-slate-400 block mb-1">الكمية</span>
                                <span class="font-bold text-teal-300">${item.quantity}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">السعر</span>
                                <span class="font-bold text-slate-200">${item.unit_price.toLocaleString()}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">الإجمالي</span>
                                <span class="font-bold text-amber-400">${item.total.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // تشغيل العرض تلقائياً كمثال افتراضي عند فتح الصفحة
        window.onload = () => {
            // محاكاة البيانات الجاهزة
            document.getElementById('itemsCount').innerText = boqData.items.length;
            document.getElementById('grandTotal').innerText = boqData.grand_total.toLocaleString();
            processBOQDefault();
        };

        function processBOQDefault() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            boqData.items.forEach(item => {
                const card = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-slate-700 text-teal-400 px-2 py-1 rounded-lg font-mono">بند: ${item.item_number}</span>
                            <span class="text-xs bg-amber-900/40 text-amber-300 px-2 py-1 rounded-lg">${item.unit}</span>
                        </div>
                        <h3 class="font-bold text-slate-100 text-sm mb-3">${item.title}</h3>
                        <div class="grid grid-cols-3 gap-2 text-xs bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center">
                            <div>
                                <span class="text-slate-400 block mb-1">الكمية</span>
                                <span class="font-bold text-teal-300">${item.quantity}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">السعر</span>
                                <span class="font-bold text-slate-200">${item.unit_price.toLocaleString()}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">الإجمالي</span>
                                <span class="font-bold text-amber-400">${item.total.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }
    </script>
</body>
</html>
