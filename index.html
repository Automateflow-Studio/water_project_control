<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الريحانة - متابعة المقايسات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-4">

    <main class="max-w-md mx-auto space-y-4">

        <!-- قسم تسجيل الدخول -->
        <div id="loginSection" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm space-y-3">
            <h2 class="text-sm font-bold text-teal-300">تسجيل الدخول</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1">اسم المستخدم (Username)</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">كلمة المرور (Password)</label>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-200 text-sm">
            </div>
            <button onclick="loginUser()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-xl transition text-sm">تسجيل الدخول</button>
        </div>

        <!-- لوحة تحكم المدير -->
        <div id="managerDashboard" class="hidden space-y-4">
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs">
                <span class="text-teal-400 font-bold">لوحة تحكم المدير العام</span>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 font-bold">تسجيل الخروج</button>
            </div>
            <h2 class="text-sm font-bold text-slate-200">المحطات المسجلة (اختر محطة لعرض بنودها):</h2>
            <div id="stationsListContainer" class="space-y-2"></div>
        </div>

        <!-- قسم محتوى المحطة -->
        <div id="dashboardSection" class="hidden space-y-4">
            <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex justify-between items-center text-xs">
                <span class="text-slate-400">المحطة: <strong id="currentStationId" class="text-teal-400 font-mono"></strong></span>
                <div class="space-x-2 space-x-reverse">
                    <button id="backToManagerBtn" onclick="backToManager()" class="hidden text-teal-400 hover:text-teal-300 font-bold">← القائمة</button>
                    <button onclick="logout()" class="text-red-400 hover:text-red-300 font-bold">خروج</button>
                </div>
            </div>

            <!-- قسم رفع المقايسة للمهندس -->
            <div id="uploadSection" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm hidden">
                <label class="block text-sm font-semibold mb-2 text-slate-300">إرفاق صورة المناقصة / المقايسة</label>
                <input type="file" id="boqImage" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-teal-600 file:text-white hover:file:bg-teal-700 cursor-pointer">
                <button onclick="uploadAndProcessBOQ()" id="submitBtn" class="mt-3 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition shadow-lg flex justify-center items-center">
                    <span>تحليل وعرض البنود</span>
                </button>
            </div>

            <!-- ملخص الحالة العامة -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm flex justify-between items-center">
                <div>
                    <span id="itemsCount" class="text-xl font-bold text-teal-400">0</span>
                    <p class="text-xs text-slate-400">إجمالي البنود</p>
                </div>
                <div class="text-left">
                    <span id="grandTotal" class="text-lg font-bold text-amber-400">0</span>
                    <p class="text-xs text-slate-400">الإجمالي الكلي</p>
                </div>
            </div>

            <h2 id="itemsHeaderTitle" class="text-md font-bold text-slate-200 mt-6 mb-3">بنود المقايسة</h2>

            <div id="itemsContainer" class="space-y-3">
                <p class="text-center text-slate-500 text-sm py-6">جاري التحميل...</p>
            </div>
        </div>

    </main>

    <!-- نافذة تحديث البند -->
    <div id="updateModal" class="fixed inset-0 bg-slate-950/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-5 w-full max-w-md space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-md font-bold text-teal-400" id="modalItemTitle">تحديث بند</h3>
                <button onclick="closeUpdateModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>

            <input type="hidden" id="modalItemNumber">

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">نسبة المنفذ مدني %</label>
                    <input type="number" id="civilProgress" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">نسبة المنفذ كهروميكانيكي %</label>
                    <input type="number" id="electroProgress" placeholder="0" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">ما تم إنجازه اليوم</label>
                <textarea id="workDoneToday" rows="2" placeholder="اكتب ما تم إنجازه..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></textarea>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">معوقات (إن وجدت)</label>
                <textarea id="workObstacles" rows="2" placeholder="ذكر أي معوقات..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></textarea>
            </div>

            <button onclick="submitItemUpdate()" id="updateSubmitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition shadow-lg">
                إرسال التحديث وحفظ البيانات
            </button>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxg_645kwu88Lram2IJ7sF9RWjoGPAnDV6qW95MQNLJZn5MbfKtxtFLL-ElrhbgKAko/exec';

        window.onload = function() {
            const savedUser = localStorage.getItem('username');
            const savedRole = localStorage.getItem('role');
            const savedStation = localStorage.getItem('station_id');

            if (savedUser) {
                if (savedRole === 'manager') {
                    showManagerDashboard(savedUser);
                } else if (savedStation) {
                    showEngineerDashboard(savedUser, savedStation);
                }
            }
        };

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!username || !password) {
                alert('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', username, password })
                });

                const textResponse = await response.text();
                let result;
                try {
                    result = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error('استجابة غير صالحة من الخادم');
                }

                if (result.status === 'success') {
                    localStorage.setItem('username', result.username);
                    localStorage.setItem('role', result.role);
                    localStorage.setItem('station_id', result.station_id || '');

                    if (result.role === 'manager') {
                        showManagerDashboard(result.username);
                    } else {
                        showEngineerDashboard(result.username, result.station_id);
                    }
                } else {
                    alert(result.message || 'فشل تسجيل الدخول');
                }
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بالخادم، يرجى المحاولة مرة أخرى.');
            }
        }

        async function showManagerDashboard(username) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('managerDashboard').classList.remove('hidden');

            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=get_stations`);
                const textResponse = await response.text();
                const result = JSON.parse(textResponse);
                renderStationsList(result.stations || []);
            } catch (err) {
                console.error(err);
                alert('فشل جلب قائمة المحطات');
            }
        }

        function renderStationsList(stations) {
            const container = document.getElementById('stationsListContainer');
            container.innerHTML = '';

            if (stations.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-sm">لا توجد محطات مسجلة.</p>';
                return;
            }

            stations.forEach(st => {
                container.innerHTML += `
                    <div onclick="managerSelectStation('${st.station_id}', '${st.username}')" class="bg-slate-800 border border-slate-700 hover:border-teal-500 p-3 rounded-xl cursor-pointer flex justify-between items-center transition">
                        <div>
                            <span class="text-teal-400 font-bold block text-sm">محطة: ${st.station_id}</span>
                            <span class="text-slate-400 text-xs">مهندس المسؤول: ${st.username}</span>
                        </div>
                        <span class="text-xs bg-teal-900/40 text-teal-300 px-2 py-1 rounded-lg">عرض البنود ←</span>
                    </div>
                `;
            });
        }

        function managerSelectStation(stationId, engineerName) {
            document.getElementById('managerDashboard').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('currentStationId').innerText = stationId;
            document.getElementById('backToManagerBtn').classList.remove('hidden');
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('itemsHeaderTitle').innerText = `بنود محطة: ${stationId} (مشاهدة التحديثات)`;

            fetchStationData(stationId, true);
        }

        function backToManager() {
            document.getElementById('dashboardSection').classList.add('hidden');
            showManagerDashboard(localStorage.getItem('username'));
        }

        function showEngineerDashboard(username, stationId) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('managerDashboard').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('currentStationId').innerText = stationId;
            document.getElementById('uploadSection').classList.remove('hidden');
            document.getElementById('backToManagerBtn').classList.add('hidden');
            document.getElementById('itemsHeaderTitle').innerText = 'بنود المقايسة الجارية (انقر لتحديث البند)';

            fetchStationData(stationId, false);
        }

        function logout() {
            localStorage.clear();
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('managerDashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        async function fetchStationData(stationId, isManagerView) {
            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?station_id=${encodeURIComponent(stationId)}`);
                const textResponse = await response.text();
                const result = JSON.parse(textResponse);
                renderBOQData(result, isManagerView);
            } catch (error) {
                console.error('خطأ في جلب بيانات المحطة:', error);
            }
        }

        async function uploadAndProcessBOQ() {
    const stationId = localStorage.getItem('station_id');
    const fileInput = document.getElementById('boqImage');
    const submitBtn = document.getElementById('submitBtn');
    
    if(fileInput.files.length === 0) {
        alert('الرجاء إرفاق صورة المقايسة أولاً');
        return;
    }

    const file = fileInput.files[0];
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="animate-pulse">جاري رفع وتحليل المقايسة...</span>';

    try {
        const base64Data = await toBase64(file);
        const payload = {
            station_id: stationId,
            fileName: file.name,
            mimeType: file.type,
            fileData: base64Data
        };

        // ** هنا التعديل: إرسال الطلب مباشرة إلى Webhook الخاص بـ n8n **
        const n8nWebhookUrl = 'https://Automateflow-n8n.rinoosolutions.com/webhook/0bc8c7ab-bc13-4306-9ae3-275f63beba22';

        const response = await fetch(n8nWebhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const textResponse = await response.text();
        let result;
        try {
            result = JSON.parse(textResponse);
        } catch (e) {
            // أحياناً n8n يرجع نصاً عادياً عند النجاح التام
            result = { status: 'success' };
        }

        alert('تم رفع وتحليل المقايسة بنجاح عبر الـ Workflow!');
        // إعادة تحميل بيانات المحطة لتحديث العرض
        fetchStationData(stationId, false);

    } catch (error) {
        console.error(error);
        alert('حدث خطأ أثناء رفع الصورة أو تحليلها: ' + error.message);
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>تحليل وعرض البنود</span>';
    }
}

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        function renderBOQData(data, isManagerView) {
            const items = data.items || [];
            const grandTotal = data.grand_total || 0;

            document.getElementById('itemsCount').innerText = items.length;
            document.getElementById('grandTotal').innerText = Number(grandTotal).toLocaleString();

            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">لم يتم العثور على بنود لهذه المحطة.</p>';
                return;
            }

            items.forEach(item => {
                const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
                const clickAction = isManagerView ? '' : `onclick="openUpdateModal(${itemJson})"`;
                const cursorStyle = isManagerView ? 'cursor-default' : 'cursor-pointer hover:border-teal-500';

                container.innerHTML += `
                    <div ${clickAction} class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm ${cursorStyle} transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-slate-700 text-teal-400 px-2 py-1 rounded-lg font-mono">بند: ${item.item_number || '-'}</span>
                            <span class="text-xs bg-amber-900/40 text-amber-300 px-2 py-1 rounded-lg">${item.unit || '-'}</span>
                        </div>
                        <h3 class="font-bold text-slate-100 text-sm mb-3">${item.title || item.description || ''}</h3>
                        
                        <div class="grid grid-cols-3 gap-2 text-xs bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center mb-3">
                            <div>
                                <span class="text-slate-400 block mb-1">الكمية</span>
                                <span class="font-bold text-teal-300">${item.quantity || 0}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">السعر</span>
                                <span class="font-bold text-slate-200">${Number(item.unit_price || 0).toLocaleString()}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">الإجمالي</span>
                                <span class="font-bold text-amber-400">${Number(item.total || 0).toLocaleString()}</span>
                            </div>
                        </div>

                        <div class="space-y-1.5 text-xs bg-slate-900/80 p-3 rounded-xl border border-slate-700/60">
                            <div class="flex justify-between text-slate-300">
                                <span>نسبة الإنجاز (مدني): <strong class="text-teal-400">${item.civil_progress || 0}%</strong></span>
                                <span>نسبة الإنجاز (كهروميكانيكي): <strong class="text-teal-400">${item.electro_progress || 0}%</strong></span>
                            </div>
                            <p class="text-slate-300"><strong>ما تم إنجازه:</strong> ${item.work_done || 'لا يوجد'}</p>
                            <p class="text-red-300"><strong>المعوقات:</strong> ${item.obstacles || 'لا يوجد'}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openUpdateModal(item) {
            document.getElementById('modalItemTitle').innerText = 'تحديث البند: ' + (item.title || item.description || '');
            document.getElementById('modalItemNumber').value = item.item_number || '';
            
            document.getElementById('civilProgress').value = item.civil_progress || '';
            document.getElementById('electroProgress').value = item.electro_progress || '';
            document.getElementById('workDoneToday').value = item.work_done || '';
            document.getElementById('workObstacles').value = item.obstacles || '';

            document.getElementById('updateModal').classList.remove('hidden');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.add('hidden');
        }

        async function submitItemUpdate() {
            const stationId = localStorage.getItem('station_id');
            const itemNumber = document.getElementById('modalItemNumber').value;
            const civilProgress = document.getElementById('civilProgress').value;
            const electroProgress = document.getElementById('electroProgress').value;
            const workDoneToday = document.getElementById('workDoneToday').value;
            const workObstacles = document.getElementById('workObstacles').value;
            const updateBtn = document.getElementById('updateSubmitBtn');

            updateBtn.disabled = true;
            updateBtn.innerText = 'جاري التحديث...';

            const payload = {
                action: 'update_item',
                engineer_id: stationId,
                item_number: itemNumber,
                civil_progress: civilProgress,
                electro_progress: electroProgress,
                work_done: workDoneToday,
                obstacles: workObstacles
            };

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const textResponse = await response.text();
                let result;
                try {
                    result = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error('فشل قراءة الاستجابة');
                }

                if (result.status === 'success') {
                    alert('تم تحديث البند بنجاح!');
                    closeUpdateModal();
                    fetchStationData(stationId, false);
                } else {
                    alert('حدث خطأ: ' + (result.message || 'فشل التحديث'));
                }
            } catch (error) {
                console.error(error);
                alert('فشل الاتصال بالخادم');
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerText = 'إرسال التحديث وحفظ البيانات';
            }
        }
    </script>
</body>
</html>
